# 文件说明：cluster.conf：运行环境与组件参数配置。
upstream ai_gateway_cluster {
    least_conn;
    server gateway-1:8080 max_fails=3 fail_timeout=10s;
    server gateway-2:8080 max_fails=3 fail_timeout=10s;
    server gateway-3:8080 max_fails=3 fail_timeout=10s;
    keepalive 128;
}

server {
    listen 8080;
    server_name _;

    client_max_body_size 100m;

    location = /healthz {
        access_log off;
        proxy_pass http://ai_gateway_cluster/actuator/health/readiness;
    }

    location ~ ^/(actuator|swagger-ui|v3/api-docs) {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://ai_gateway_cluster;
    }

    location /internal/ {
        deny all;
    }

    location / {
        proxy_pass http://ai_gateway_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
