# Copy the desired entries into services.yml, then restart the gateway.
# UPSTREAM_BASE_URL should be an OpenAI-compatible endpoint reachable from the container.
model:
  services:
    chat:
      adapter: normal
      load-balance: { type: least-connections }
      instances:
        - name: "${CHAT_MODEL_NAME:qwen3}"
          base-url: "${UPSTREAM_BASE_URL:http://host.docker.internal:9090}"
          path: "/v1/chat/completions"
          weight: 1
          headers: { Authorization: "Bearer ${UPSTREAM_API_KEY:}" }
    embedding:
      adapter: normal
      load-balance: { type: round-robin }
      instances:
        - name: "${EMBEDDING_MODEL_NAME:bge-m3}"
          base-url: "${UPSTREAM_BASE_URL:http://host.docker.internal:9090}"
          path: "/v1/embeddings"
          weight: 1
          headers: { Authorization: "Bearer ${UPSTREAM_API_KEY:}" }
    rerank:
      adapter: normal
      load-balance: { type: round-robin }
      instances:
        - name: "${RERANK_MODEL_NAME:bge-reranker-v2-m3}"
          base-url: "${UPSTREAM_BASE_URL:http://host.docker.internal:9090}"
          path: "/v1/rerank"
          weight: 1
          headers: { Authorization: "Bearer ${UPSTREAM_API_KEY:}" }
    tts:
      adapter: normal
      load-balance: { type: round-robin }
      instances:
        - name: "${TTS_MODEL_NAME:tts-model}"
          base-url: "${UPSTREAM_BASE_URL:http://host.docker.internal:9090}"
          path: "/v1/audio/speech"
          weight: 1
          headers: { Authorization: "Bearer ${UPSTREAM_API_KEY:}" }
    stt:
      adapter: normal
      load-balance: { type: round-robin }
      instances:
        - name: "${STT_MODEL_NAME:whisper-model}"
          base-url: "${UPSTREAM_BASE_URL:http://host.docker.internal:9090}"
          path: "/v1/audio/transcriptions"
          weight: 1
          headers: { Authorization: "Bearer ${UPSTREAM_API_KEY:}" }
    imgGen:
      adapter: normal
      load-balance: { type: round-robin }
      instances:
        - name: "${IMAGE_MODEL_NAME:image-model}"
          base-url: "${UPSTREAM_BASE_URL:http://host.docker.internal:9090}"
          path: "/v1/images/generations"
          weight: 1
          headers: { Authorization: "Bearer ${UPSTREAM_API_KEY:}" }
    imgEdit:
      adapter: normal
      load-balance: { type: round-robin }
      instances:
        - name: "${IMAGE_EDIT_MODEL_NAME:image-edit-model}"
          base-url: "${UPSTREAM_BASE_URL:http://host.docker.internal:9090}"
          path: "/v1/images/edits"
          weight: 1
          headers: { Authorization: "Bearer ${UPSTREAM_API_KEY:}" }
    vidGen:
      adapter: normal
      load-balance: { type: round-robin }
      instances:
        - name: "${VIDEO_MODEL_NAME:video-model}"
          base-url: "${UPSTREAM_BASE_URL:http://host.docker.internal:9090}"
          path: "/v1/videos/generations"
          weight: 1
          headers: { Authorization: "Bearer ${UPSTREAM_API_KEY:}" }
