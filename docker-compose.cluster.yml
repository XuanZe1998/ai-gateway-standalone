# 文件说明：docker-compose.cluster.yml：容器编排配置，定义相应部署模式的服务与依赖。
name: ai-gateway-cluster

x-gateway-common: &gateway-common
  image: ai-gateway-standalone:cluster
  build:
    context: .
    dockerfile: Dockerfile.cluster
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment: &gateway-environment
    SPRING_PROFILES_ACTIVE: standalone,cluster
    SERVER_PORT: 8080
    PG_HOST: postgres
    PG_PORT: 5432
    PG_DB: ${PG_DB:-ai_gateway}
    PG_SCHEMA: public
    PG_USER: ${PG_USER:-ai_gateway}
    PG_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in .env.cluster}
    PG_POOL_MAX: ${PG_POOL_MAX:-15}
    PG_POOL_MIN: ${PG_POOL_MIN:-3}
    HIBERNATE_DDL_AUTO: ${HIBERNATE_DDL_AUTO:-update}
    FLYWAY_ENABLED: ${FLYWAY_ENABLED:-false}
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.cluster}
    REDIS_DATABASE: ${REDIS_DATABASE:-0}
    JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.cluster}
    INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
    INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?set INITIAL_ADMIN_PASSWORD in .env.cluster}
    GATEWAY_API_KEY: ${GATEWAY_API_KEY:?set GATEWAY_API_KEY in .env.cluster}
    CONFIG_SYNC_INTERVAL_MS: ${CONFIG_SYNC_INTERVAL_MS:-3000}
    DISTRIBUTED_RATE_LIMIT_ENABLED: ${DISTRIBUTED_RATE_LIMIT_ENABLED:-true}
    DISTRIBUTED_RATE_LIMIT_FAIL_OPEN: ${DISTRIBUTED_RATE_LIMIT_FAIL_OPEN:-false}
    DISTRIBUTED_RATE_LIMIT_TIMEOUT_MS: ${DISTRIBUTED_RATE_LIMIT_TIMEOUT_MS:-250}
    STUDENT_MONTHLY_TOKEN_QUOTA: ${STUDENT_MONTHLY_TOKEN_QUOTA:-1000000}
    STAFF_MONTHLY_TOKEN_QUOTA: ${STAFF_MONTHLY_TOKEN_QUOTA:-3000000}
    TEACHER_MONTHLY_TOKEN_QUOTA: ${TEACHER_MONTHLY_TOKEN_QUOTA:-5000000}
    QUOTA_TIME_ZONE: ${QUOTA_TIME_ZONE:-Asia/Shanghai}
    JAVA_OPTS: ${JAVA_OPTS:--Xms1g -Xmx4g -XX:+UseG1GC -XX:+UseContainerSupport -XX:+ExitOnOutOfMemoryError}
    TZ: ${TZ:-Asia/Shanghai}
  volumes:
    - ./config-external:/app/config:ro
  healthcheck:
    test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health/readiness"]
    interval: 15s
    timeout: 5s
    retries: 10
    start_period: 90s
  restart: unless-stopped
  networks: [gateway-cluster]

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PG_DB:-ai_gateway}
      POSTGRES_USER: ${PG_USER:-ai_gateway}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in .env.cluster}
    volumes:
      - cluster-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks: [gateway-cluster]

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass '$$REDIS_PASSWORD'"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.cluster}
    volumes:
      - cluster-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks: [gateway-cluster]

  gateway-1:
    <<: *gateway-common
    environment:
      <<: *gateway-environment
      GATEWAY_INSTANCE_ID: gateway-1
      SCHEDULING_ENABLED: "false"

  gateway-2:
    <<: *gateway-common
    environment:
      <<: *gateway-environment
      GATEWAY_INSTANCE_ID: gateway-2
      SCHEDULING_ENABLED: "false"

  gateway-3:
    <<: *gateway-common
    environment:
      <<: *gateway-environment
      GATEWAY_INSTANCE_ID: gateway-3
      SCHEDULING_ENABLED: "false"

  worker:
    <<: *gateway-common
    environment:
      <<: *gateway-environment
      GATEWAY_INSTANCE_ID: worker-1
      SCHEDULING_ENABLED: "true"

  load-balancer:
    image: nginx:1.27-alpine
    depends_on:
      gateway-1:
        condition: service_healthy
      gateway-2:
        condition: service_healthy
      gateway-3:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT:-38008}:8080"
    volumes:
      - ./config-external/nginx/cluster.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks: [gateway-cluster]

volumes:
  cluster-postgres-data:
  cluster-redis-data:

networks:
  gateway-cluster:
    driver: bridge
