# 文件说明：secret.example.yaml：Kubernetes 资源与部署策略。
apiVersion: v1
kind: Secret
metadata:
  name: ai-gateway-secrets
  namespace: ai-gateway
type: Opaque
stringData:
  PG_HOST: "postgresql.example.internal"
  PG_PORT: "5432"
  PG_DB: "ai_gateway"
  PG_USER: "ai_gateway"
  PG_PASSWORD: "replace-me"
  REDIS_HOST: "redis.example.internal"
  REDIS_PORT: "6379"
  REDIS_PASSWORD: "replace-me"
  JWT_SECRET: "replace-with-at-least-32-random-bytes"
  INITIAL_ADMIN_PASSWORD: "replace-me"
  GATEWAY_API_KEY: "sk-replace-me"
  CAMPUS_ADMIN_ACCOUNTS: "" # comma-separated CAS accounts; do not commit real values
  TEACHER_TOKEN_SECRET: "replace-with-at-least-32-random-bytes"

