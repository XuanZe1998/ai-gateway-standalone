# Requires External Secrets Operator. Adapt secretStoreRef and remote keys to the campus vault.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-gateway-secrets
  namespace: ai-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: campus-vault
  target:
    name: ai-gateway-secrets
    creationPolicy: Owner
  data:
    - secretKey: PG_JDBC_URL
      remoteRef: {key: ai-gateway/production, property: pg_jdbc_url}
    - secretKey: PG_USER
      remoteRef: {key: ai-gateway/production, property: pg_user}
    - secretKey: PG_PASSWORD
      remoteRef: {key: ai-gateway/production, property: pg_password}
    - secretKey: REDIS_HOST
      remoteRef: {key: ai-gateway/production, property: redis_host}
    - secretKey: REDIS_PORT
      remoteRef: {key: ai-gateway/production, property: redis_port}
    - secretKey: REDIS_PASSWORD
      remoteRef: {key: ai-gateway/production, property: redis_password}
    - secretKey: JWT_SECRET
      remoteRef: {key: ai-gateway/production, property: jwt_secret}
    - secretKey: INITIAL_ADMIN_PASSWORD
      remoteRef: {key: ai-gateway/production, property: initial_admin_password}
    - secretKey: GATEWAY_API_KEY
      remoteRef: {key: ai-gateway/production, property: bootstrap_api_key}
    - secretKey: CAMPUS_ADMIN_ACCOUNTS
      remoteRef:
        key: ai-gateway/production
        property: campus_admin_accounts
    - secretKey: TEACHER_TOKEN_SECRET
      remoteRef:
        key: ai-gateway/production
        property: teacher_token_secret
