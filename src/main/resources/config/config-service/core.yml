# ========================================
# 配置服务核心配置 (config 模块)
# ========================================
# 此文件包含 ConfigurationService 核心配置
# 位置：org.unreal.modelrouter.config.core

store:
  # 存储类型（v1.5.1+ 使用 JPA）
  type: jpa
  
  # 配置文件路径（用于导入导出）
  path: ./config
  
  # 备用存储类型（用于降级）
  fallback-storage: memory
  
  # 配置迁移开关
  migration:
    enabled: true
  
  # 安全数据迁移开关
  security-migration:
    enabled: true

# 数据源由 postgresql.yml 提供，此处不再定义