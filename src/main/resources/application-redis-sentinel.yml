# Optional profile for an independently operated Redis Sentinel cluster.
# Activate with: standalone,cluster,oidc,redis-sentinel
spring:
  data:
    redis:
      sentinel:
        master: ${REDIS_SENTINEL_MASTER:mymaster}
        nodes: ${REDIS_SENTINEL_NODES}
        password: ${REDIS_SENTINEL_PASSWORD:${REDIS_PASSWORD:}}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:2s}
